org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# ⚠️ Память подобрана под ЭТУ машину: физической памяти 47 ГБ, но лимит
# выделения (commit) практически исчерпан другими процессами — свободно ~1.7 ГБ.
# Шаблонные -Xmx8G и отдельный демон Kotlin просто не стартуют
# (DOS error 1455 — ERROR_COMMITMENT_LIMIT). Отсюда: одна JVM, скромная куча,
# сериальный GC. На машине с нормальным запасом значения можно поднять.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
# Kotlin компилируется ВНУТРИ процесса Gradle: отдельный демон — это вторая JVM
# со своей кучей, а второй кучи здесь не из чего выделить.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx512m -XX:+UseSerialGC
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
