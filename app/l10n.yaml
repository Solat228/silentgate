# Кодоген локализаций (flutter gen-l10n). База — русский (app_ru.arb).
# Генерим реальные файлы в lib/l10n/gen (не синтетический пакет) — их можно
# импортировать напрямую и они переживают сборку через junction.
arb-dir: lib/l10n
output-dir: lib/l10n/gen
template-arb-file: app_ru.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
