name: silentgate
description: "SilentGate VPN client"
publish_to: 'none'
version: 1.12.0+74

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  # Локализация интерфейса (i18n): официальный gen_l10n на ARB-файлах.
  flutter_localizations:
    sdk: flutter
  intl: any
  # Аннотации анализатора (@visibleForTesting). Транзитивно она приходит и с
  # flutter, но импорт из lib/ без явной строки здесь запрещает линт
  # depend_on_referenced_packages, а без аннотации счётчики работы показа
  # (log_line.dart) выглядели бы боевым API. Сам log_line.dart тянуть flutter
  # не может: его flutter-независимость стережёт log_parser_no_io_test.dart.
  meta: any
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2
  win32: ^5.5.0
  ffi: ^2.1.0
  file_selector: ^1.0.3
  country_flags: ^3.1.0
  window_manager: ^0.4.2
  tray_manager: ^0.3.2
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Кодоген локализаций (см. l10n.yaml): создаёт AppLocalizations из lib/l10n/*.arb.
  generate: true
  assets:
    - assets/tray_icon.ico
    # Бренд-иконки проверяемых сервисов (ProbeService). ⚠️ Лежат в поставке
    # намеренно: раньше все 14 качались из сети при первом показе, и любой сбой
    # оставлял серый глобус — а на трёх сервисах подряд успевала нарисоваться
    # чужая иконка. Имя файла — по ИМЕНИ СЕРВИСА, не по домену (домен меняется:
    # twitter.com → x.com). Соответствие стережёт test/site_favicon_race_test.dart.
    - assets/services/
    # Второй значок трея — состояние «VPN выключен» (серый). Без строки здесь
    # файл в поставку не попадёт, а трей молча останется с прежним значком.
    - assets/tray_icon_off.ico
    # ⚠️ Обязательное раскрытие, а не украшение. На Android ядра встроены В
    # приложение (libcores.so внутри APK), а sing-box — GPL-3.0: текст лицензии
    # обязан ехать вместе с бинарником. На Windows это закрывалось папкой
    # `licenses` рядом с exe, у APK такой папки нет — значит только ассеты.
    - assets/licenses/
